<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Monitoring System - Live</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
}

.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: #0d6efd;
  color: #fff;
  padding-top: 20px;
  transition: transform 0.3s;
  z-index: 1050;
}

.sidebar a {
  display: block;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
  border-radius: 8px;
  margin: 5px 10px;
}

.sidebar a:hover {
  background: #0b5ed7;
}


.main {
  margin-left: 230px;
  padding: 20px;
  transition: margin-left 0.3s;
}


@media (max-width: 991px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.show {
    transform: translateX(0);
  }
  .main {
    margin-left: 0;
  }
}


.card .noise-value {
  font-size: 4rem;
  font-weight: bold;
}

.card .status {
  font-size: 1.3rem;
  font-weight: bold;
}

.progress {
  height: 30px;
}
</style>
</head>

<body>


<div class="sidebar">
  <h4 class="text-center mb-4">Noise Monitor</h4>
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="livemonitoring.html"><i class="bi bi-activity"></i> Live Monitoring</a>
  <a href="noiselev.html"><i class="bi bi-volume-up"></i> Noise Levels</a>
  <a href="alert.html"><i class="bi bi-bell"></i> Alerts</a>
  <a href="set.html"><i class="bi bi-gear"></i> Settings</a>
</div>


<div class="main">

 
  <nav class="navbar navbar-light bg-light rounded mb-4 shadow-sm">
    <div class="container-fluid">
      <button class="btn btn-outline-primary d-lg-none" id="menuToggle">
        <i class="bi bi-list"></i>
      </button>
      <span class="navbar-brand fw-bold">Live Monitoring</span>
    </div>
  </nav>

  
  <div class="card p-4 mb-3">
    <div>Current Noise Level</div>
    <div class="noise-value" id="noiseValue">-- dB</div>
    <div class="status" id="noiseStatus">Waiting for data...</div>
  </div>

 
  <div class="card p-4">
    <div class="mb-2">Noise Intensity</div>
    <div class="progress">
      <div id="noiseBar" class="progress-bar bg-success" style="width: 0%"></div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="live.js"></script>
</body>
</html>
