<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Monitoring System - Noise Levels</title>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
}


.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: #0d6efd;
  color: #fff;
  padding-top: 20px;
  transition: transform 0.3s;
  z-index: 1050;
}

.sidebar h4 {
  font-weight: bold;
}

.sidebar a {
  display: block;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
  border-radius: 8px;
  margin: 5px 10px;
}

.sidebar a:hover {
  background: #0b5ed7;
}


.main {
  margin-left: 230px;
  padding: 20px;
  transition: margin-left 0.3s;
}


.noise-card {
  text-align: center;
  padding: 30px;
  border-radius: 12px;
  background-color: #e9ecef;
}
.noise-card .card-title {
  font-size: 1rem;
  font-weight: bold;
}
.noise-value {
  font-size: 3rem;
  font-weight: bold;
  margin-top: 10px;
}


@media (max-width: 991px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.show {
    transform: translateX(0);
  }
  .main {
    margin-left: 0;
  }
}
</style>
</head>
<body>


<div class="sidebar">
  <h4 class="text-center mb-4">Noise Monitor</h4>
  <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="livemonitoring.html"><i class="bi bi-activity"></i> Live Monitoring</a>
  <a href="noiselev.html"><i class="bi bi-volume-up"></i> Noise Levels</a>
  <a href="alert.html"><i class="bi bi-bell"></i> Alerts</a>
  <a href="set.html"><i class="bi bi-gear"></i> Settings</a>
</div>

<div class="main">


  <nav class="navbar navbar-light bg-light rounded mb-4 shadow-sm">
    <div class="container-fluid">
      <button class="btn btn-outline-primary d-lg-none me-2" id="menuToggle">
        <i class="bi bi-list"></i>
      </button>
      <span class="navbar-brand fw-bold">Noise Levels</span>
    </div>
  </nav>


  <div class="row g-3">
    <div class="col-12 col-md-4">
      <div class="noise-card">
        <div class="card-title">Current Noise</div>
        <div class="noise-value" id="currentNoise">-- dB</div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="noise-card">
        <div class="card-title">Max Noise</div>
        <div class="noise-value" id="maxNoise">-- dB</div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="noise-card">
        <div class="card-title">Average Noise</div>
        <div class="noise-value" id="avgNoise">-- dB</div>
      </div>
    </div>
  </div>

</div>



<script src="noise.js"></script>

</body>
</html>
