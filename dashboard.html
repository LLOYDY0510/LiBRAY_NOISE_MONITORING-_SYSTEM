<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Monitoring System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
  background-color: #f8f9fa;
  font-family: Arial, sans-serif;
}

.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: #0d6efd;
  color: #fff;
  padding-top: 20px;
  transition: transform 0.3s;
  z-index: 1050;
}

.sidebar a {
  display: block;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
  border-radius: 8px;
  margin: 5px 10px;
}

.sidebar a:hover {
  background: #0b5ed7;
}


.main {
  margin-left: 230px;
  padding: 20px;
  transition: margin-left 0.3s;
}


@media (max-width: 991px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.show {
    transform: translateX(0);
  }
  .main {
    margin-left: 0;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <h4 class="text-center mb-4">Noise Monitor</h4>
  <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="livemonitoring.html"><i class="bi bi-activity"></i> Live Monitoring</a>
  <a href="noiselev.html"><i class="bi bi-volume-up"></i> Noise Levels</a>
  <a href="alert.html"><i class="bi bi-bell"></i> Alerts</a>
  <a href="set.html"><i class="bi bi-gear"></i> Settings</a>
</div>


<div class="main">
<nav class="navbar navbar-expand-lg navbar-light bg-light rounded mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"> Live Monitoring</span>
      <div class="dropdown ms-auto">
        <button class="btn btn-primary rounded-circle dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="admin.html">Profile</a></li>
          <li><a class="dropdown-item" href="index.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>
  


  <nav class="navbar bg-light rounded mb-4 shadow-sm">
    <div class="container-fluid">
      <button class="btn btn-outline-primary d-lg-none" id="menuToggle">
        <i class="bi bi-list"></i>
      </button>
      <span class="navbar-brand fw-bold">Noise Monitoring System</span>
    </div>
  </nav>

 
  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-3">
      <div class="card bg-primary text-white">
        <div class="card-body">
          <h6>Average Noise</h6>
          <p class="card-text fs-3">0 dB</p>
        </div>
      </div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <div class="card bg-success text-white">
        <div class="card-body">
          <h6>Max Noise</h6>
          <p class="card-text fs-3">0 dB</p>
        </div>
      </div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <div class="card bg-warning text-white">
        <div class="card-body">
          <h6>Alerts</h6>
          <p class="card-text fs-3">0</p>
        </div>
      </div>
    </div>

    <div class="col-sm-6 col-lg-3">
      <div class="card bg-info text-white">
        <div class="card-body">
          <h6>Sensors Online</h6>
          <p class="card-text fs-3">0</p>
        </div>
      </div>
    </div>
  </div>

 
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="card p-3">
        <h5>Noise Levels Over Time</h5>
        <canvas id="noiseChart"></canvas>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card p-3">
        <h5>Event Calendar</h5>
        <div id="calendar"></div>
      </div>
    </div>
  </div>

</div>

<script src="dash.js">
</script>

</body>
</html>
